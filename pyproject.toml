[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = """
    --strict-markers
    --cov=modules
    --cov-report=term-missing
    --cov-report=html
    -v
"""
markers = [
    "unit: Unit tests (fast)",
    "integration: Integration tests (slower)",
    "golden: Golden Master tests (critical)",
]

[tool.ruff]
# Line length limit
line-length = 100

# Exclude directories
exclude = [
    ".git",
    ".venv",
    "venv",
    "__pycache__",
    "build",
    "dist",
    "*.egg-info",
]

# Target Python 3.13
target-version = "py313"

[tool.ruff.lint]
# Enable strict linting rules
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "W",   # pycodestyle warnings
]

# Ignore specific rules
ignore = [
    "E501",  # line-too-long (handled by formatter)
    "E701",  # multiple-statements-on-one-line-colon (style preference)
]


[tool.bandit]
# Bandit security linter configuration
exclude_dirs = [".venv", "venv", "tests", "build", "dist"]
skips = ["B101"]  # Skip assert_used (common in tests)


