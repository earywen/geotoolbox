# Legend configuration
legend:
  notes:
    - "LQ : Limite de quantification du laboratoire / n.d. : Non détecté"
    - "(1) Valeurs en gras : source = Teneurs totales en éléments traces métalliques dans les sols, Denis BAIZE, INRA. En italique : source = ATSDR"
    - "(2) Valeurs limites indicatives issues des textes européens, des arrêtés ministériel et des critères communément appliqués par les centres de stockage"
    - "(3) [Pour l'acceptation en ISDI], une valeur limite plus élevée peut être admise, à condition que la valeur limite de 500 mg/kg de matière sèche soit respectée pour le carbone organique total sur éluat."
    - "(4) Valeur limite des ISDI : valeur non règlementaire mais parfois appliquée par les gestionnaires d'ISDI"
    - "(5) Si le déchet ne respecte pas au moins une des valeurs fixées pour le chlorure, le sulfate ou la fraction soluble, le déchet peut être encore jugé conforme aux critères d'admission [en ISDI]."
  color_items:
    - bg_color: "#FFFFFF"
      font_color: black
      description: "Concentration supérieure au bruit de fond et inférieure aux valeurs limites des ISDI"
    - bg_color: "#FFCCFF"
      font_color: black
      description: "Concentration supérieure au seuil de vigilance du HCSP"
    - bg_color: "#FFCCFF"
      font_color: red
      description: "Concentration supérieure au seuil de dépistage du HCSP"
    - bg_color: "#CCFFFF"
      font_color: black
      description: "Concentration supérieure aux valeurs limites des ISDI et inférieure aux valeurs limites des ISDI+"
    - bg_color: "#FFFF99"
      font_color: black
      description: "Concentration supérieure aux valeurs limites des ISDI+ et inférieure aux valeurs limites des ISDND"
    - bg_color: "#FF99CC"
      font_color: black
      description: "Concentration supérieure aux valeurs limites des ISDND et inférieure aux valeurs limites des ISDD"
    - bg_color: "#FFFFFF"
      font_color: red
      description: "Concentration supérieure aux valeurs limites des ISDI, des ISDI+, des ISDND, des ISDD"
