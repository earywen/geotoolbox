# AGROLAB - Configuration Sols (Polluants)
# =========================================

matrix: sols

# Parsing configuration
parsing:
  date_row: 0
  name_row: 2
  data_start_row: 13
  date_format: "%Y%m%d"
  sample_exclude_keywords:
    - "nan"
    - "résultat"
    - "resultat"
    - "lithologie"
    - "nom d'échantillon"
    - "unité"
    - "unit"
    - "unite"

# Column mapping (0-indexed)
# RAW file: col 0=name, col 2=code, col 5=unit
columns:
  code: 0
  name: 1
  unit: 5
  family: 4
  raw_code_col: 2  # Code column in RAW file

# Regulatory columns and headers
regulatory_cols: [6, 10, 11, 13, 14, 16]
regulatory_headers:
  - title: "Bruit de fond (1)"
    color: white
    column: 6
  - title: "HCSP (seuil de vigilance / dépistage)"
    color: pink
    column: 10
  - title: "Valeurs limite des ISDI"
    color: white
    column: 11
  - title: "Valeurs limites des ISDI + (ISDI aménagées) (2)"
    color: cyan
    column: 13
  - title: "Valeurs limites des ISDND (2)"
    color: yellow
    column: 14
  - title: "Valeurs limites des ISDD (2)"
    color: red
    column: 16

# Key aliases (Raw Key -> Reference Key)
key_aliases:
  "50521": "43425"  # >C6-C8
  "46226": "43426"  # >C8-C10

