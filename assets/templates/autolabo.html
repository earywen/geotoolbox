<style>
    #autolabo-container {
        position: relative;
        width: 100%;
        height: 100%;
        background: var(--bg-dark);
    }

    #autolabo-sidebar {
        position: absolute;
        width: 380px;
        top: 20px;
        left: 100px;
        bottom: 20px;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        z-index: 1000;
    }

    #autolabo-scroll-area {
        flex: 1;
        overflow-y: auto;
        padding: 25px;
    }

    .autolabo-dropzone {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 180px;
        border: 2px dashed rgba(255, 255, 255, 0.15);
        border-radius: 16px;
        cursor: pointer;
        transition: all 0.3s ease;
        background: rgba(15, 23, 42, 0.4);
    }

    .autolabo-dropzone:hover {
        border-color: var(--accent);
        background: rgba(56, 189, 248, 0.05);
    }

    .autolabo-dropzone.drag-active {
        background: rgba(56, 189, 248, 0.1);
        border-color: var(--accent);
        box-shadow: 0 0 20px rgba(56, 189, 248, 0.2);
    }

    .autolabo-dropzone .drop-icon {
        font-size: 48px;
        margin-bottom: 12px;
        opacity: 0.8;
    }

    .autolabo-dropzone h4 {
        margin: 0 0 5px 0;
        font-size: 14px;
        font-weight: 600;
    }

    .autolabo-dropzone p {
        margin: 0;
        font-size: 12px;
        color: var(--text-muted);
    }

    .file-item {
        background: rgba(30, 41, 59, 0.6);
        padding: 10px 15px;
        margin-bottom: 8px;
        border-radius: 10px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .file-item .file-name {
        font-size: 13px;
        font-weight: 500;
        display: flex;
        align-items: center;
        gap: 8px;
    }

    .file-item .remove {
        cursor: pointer;
        opacity: 0.5;
        font-size: 18px;
        transition: all 0.2s;
    }

    .file-item .remove:hover {
        opacity: 1;
        color: #f87171;
    }

    .logs-box {
        margin-top: 15px;
        font-size: 11px;
        font-family: monospace;
        color: #cbd5e1;
        height: 120px;
        overflow-y: auto;
        background: rgba(15, 23, 42, 0.6);
        padding: 10px;
        border-radius: 8px;
        border: 1px solid rgba(255, 255, 255, 0.1);
    }
</style>

<div id="autolabo-container">
    <!-- FLOATING SIDEBAR -->
    <div id="autolabo-sidebar" class="glass-panel slide-in-panel" style="border-radius: 20px;">
        <div id="autolabo-scroll-area">
            <h2 style="display: flex; align-items: center; gap: 10px; font-size: 20px; margin-bottom: 8px;">
                <span class="text-accent">🧪</span> AutoLabo
            </h2>
            <p class="text-muted" style="font-size: 12px; margin-bottom: 25px; line-height: 1.5;">
                Traitement automatique des rapports de laboratoire.
            </p>

            <!-- SECTION 1: LABORATOIRE -->
            <div class="card" style="margin-bottom: 20px;">
                <div class="section-title" style="margin-top: 0;">1. LABORATOIRE</div>
                <select id="provider-select" class="input-pill" style="width: 100%; padding: 12px 15px; height: auto;">
                    <option value="agrolab">🧪 AGROLAB France</option>
                    <option value="eurofins" disabled>🔬 EUROFINS (bientôt)</option>
                </select>
            </div>

            <!-- SECTION 2: MATRICE -->
            <div class="card" style="margin-bottom: 20px;">
                <div class="section-title" style="margin-top: 0;">2. MATRICE</div>
                <select id="matrix-select" class="input-pill" style="width: 100%; padding: 12px 15px; height: auto;">
                    <option value="es">Eaux Souterraines</option>
                    <option value="sols">Sols (Polluants)</option>
                    <option value="sup" disabled>Eaux de Surface (WIP)</option>
                </select>
            </div>

            <!-- SECTION 3: FICHIERS -->
            <div class="card" style="margin-bottom: 20px;">
                <div class="section-title" style="margin-top: 0;">3. FICHIERS</div>

                <div id="autolabo-dropzone" class="autolabo-dropzone">
                    <div class="drop-icon">📄</div>
                    <h4>Glisser le fichier Labo ici</h4>
                    <p>ou cliquer pour parcourir</p>
                </div>

                <div id="file-list" style="margin-top: 15px; max-height: 120px; overflow-y: auto;">
                    <!-- Items added by JS -->
                </div>
            </div>

            <!-- SECTION 4: EXPORT -->
            <div class="card" style="margin-bottom: 20px;">
                <div class="section-title" style="margin-top: 0;">4. EXPORT</div>
                <div class="input-group">
                    <input type="text" id="autolabo-target-path" class="input-pill" readonly
                        placeholder="Dossier cible...">
                    <button class="btn-icon-input" onclick="autoLaboBrowseFolder()">📂</button>
                </div>
            </div>

            <!-- SECTION 5: LANCEMENT -->
            <div style="margin-top: auto;">
                <div class="section-title">5. LANCEMENT</div>
                <button id="btn-process-autolabo" onclick="runAutoLabo()" class="btn-glow"
                    style="width: 100%; border-radius: 12px;" disabled>
                    🚀 Lancer le Traitement
                </button>
                <div id="autolabo-logs" class="logs-box">En attente...</div>
            </div>
        </div>
    </div>
</div>
