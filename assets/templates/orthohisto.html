<style>
    #ortho-sidebar {
        position: absolute;
        width: 360px;
        top: 20px;
        left: 100px;
        bottom: 20px;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        z-index: 1000;
        padding: 20px 0;
    }

    .logs-box {
        margin-top: 10px;
        font-size: 11px;
        font-family: monospace;
        color: #cbd5e1;
        height: 150px;
        overflow-y: auto;
        background: rgba(15, 23, 42, 0.6);
        padding: 5px;
        border-radius: 4px;
        border: 1px solid rgba(255, 255, 255, 0.1);
    }
</style>

<div id="ortho-container" style="position: relative; width: 100%; height: 100%;">

    <!-- MAP (Background) -->
    <div id="orthoMap" style="position: absolute; inset: 0; z-index: 0; background: #1e293b;"></div>

    <!-- FLOATING SIDEBAR -->
    <div id="ortho-sidebar" class="glass-panel slide-in-panel" style="border-radius: 20px;">

        <div style="flex:1; overflow-y: auto; padding: 0 25px;">
            <h2 style="display:flex; align-items:center; gap:10px; font-size: 20px; margin-bottom: 20px;">
                <span class="text-accent">⏳</span> Chronologie
            </h2>

            <p class="text-muted" style="font-size:12px; margin-bottom:20px; line-height: 1.5;">
                Reconstituez l'évolution historique de votre site de <strong>1920 à aujourd'hui</strong>.
            </p>

            <div class="card" style="margin-bottom: 20px;">
                <div class="section-title" style="margin-top:0;">1. CIBLE & RAYON</div>
                <div class="input-container" style="background:transparent; padding:0; margin-bottom: 10px;">
                    <input type="text" id="orthoCoords" class="input-pill" readonly
                        placeholder="Cliquez sur la carte..." style="color:var(--accent); text-align:center;">
                </div>

                <div class="slider-container">
                    <div
                        style="display:flex; justify-content:space-between; margin-bottom:5px; font-size:13px; font-weight:600;">
                        <label>Zone</label>
                        <span id="orthoRadiusDisplay" class="text-accent">500 m</span>
                    </div>
                    <input type="range" id="orthoRadiusInput" min="50" max="1000" step="50" value="500"
                        style="width:100%; accent-color: var(--accent);" oninput="orthoUpdateRadius()">
                </div>
            </div>

            <div class="card" style="margin-bottom: 20px;">
                <div class="section-title" style="margin-top:0;">2. STOCKAGE</div>
                <div class="input-group">
                    <input type="text" id="orthoTargetPath" class="input-pill" readonly placeholder="Dossier cible...">
                    <button class="btn-icon-input" onclick="orthoBrowseFolder()">📂</button>
                </div>
            </div>

            <div style="margin-top:auto;">
                <button class="btn-glow" onclick="startFullExtraction()" style="width:100%; border-radius: 12px;">
                    🚀 Lancer l'extraction
                </button>
                <div id="orthoLogs" class="logs-box">En attente...</div>
            </div>
        </div>
    </div>
</div>

<script>
    var oMap, oMarker, oSquare, selectedLat = 0, selectedLon = 0;

    function init_orthohisto() {
        if (oMap) {
            ortho_syncFromState();
            setTimeout(() => oMap.invalidateSize(), 200);
            return;
        }
        oMap = L.map('orthoMap', { zoomControl: false }).setView([46.6, 1.8], 6);
        L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png').addTo(oMap);
        L.control.zoom({ position: 'topright' }).addTo(oMap);
        L.Control.geocoder({ geocoder: L.Control.Geocoder.photon({ geocodingQueryParams: { lang: 'fr' } }), defaultMarkGeocode: false })
            .on('markgeocode', function (e) { orthoUpdateSelection(e.geocode.center); oMap.setView(e.geocode.center, 15); }).addTo(oMap);
        oMap.on('click', function (e) { orthoUpdateSelection(e.latlng); });

        // SYNC WRITE
        oMap.on('moveend', function () {
            updateSharedState({ center: oMap.getCenter(), zoom: oMap.getZoom() }, null);
        });

        // Initial Sync
        ortho_syncFromState();
        setTimeout(() => oMap.invalidateSize(), 200);
    }

    function ortho_syncFromState() {
        var state = getSharedState();
        if (state.viewport) {
            oMap.setView(state.viewport.center, state.viewport.zoom, { animate: false });
        }
        if (state.selection) {
            orthoUpdateSelection(state.selection, true);
        }
    }

    function orthoUpdateSelection(l, skipWrite) {
        if (!skipWrite) {
            updateSharedState(null, { lat: l.lat, lng: l.lng });
            smartPanTo(oMap, l);
        }

        selectedLat = l.lat; selectedLon = l.lng;
        document.getElementById('orthoCoords').value = selectedLat.toFixed(5) + ", " + selectedLon.toFixed(5);
        if (oMarker) oMap.removeLayer(oMarker); oMarker = L.marker(l).addTo(oMap);
        orthoUpdateVisuals();
    }

    function orthoUpdateVisuals() {
        if (!selectedLat) return;
        if (oSquare) oMap.removeLayer(oSquare);
        var r = parseInt(document.getElementById('orthoRadiusInput').value);
        var d = r / 111000;
        var b = [[selectedLat - d, selectedLon - d], [selectedLat + d, selectedLon + d]];
        oSquare = L.rectangle(b, { color: "#10b981", weight: 2, fillOpacity: 0.1 }).addTo(oMap);
    }

    function orthoUpdateRadius() {
        document.getElementById('orthoRadiusDisplay').innerText = document.getElementById('orthoRadiusInput').value + " m";
        orthoUpdateVisuals();
    }

    function orthoBrowseFolder() { pywebview.api.select_directory().then(p => { if (p) document.getElementById('orthoTargetPath').value = p; }); }

    function startFullExtraction() {
        if (!selectedLat) return showToast("error", "Sélectionnez d'abord une zone sur la carte (clic).");
        var r = document.getElementById('orthoRadiusInput').value;
        var p = document.getElementById('orthoTargetPath').value;
        var l = document.getElementById('orthoLogs');

        showLoader("Extraction Globale");
        l.innerHTML = "Démarrage de l'analyse...<br>";

        pywebview.api.run_full_process(selectedLat, selectedLon, r, p).then(res => {
            hideLoader();
            if (res.folder) {
                l.innerHTML = "<b>TERMINÉ !</b><br>";
                l.innerHTML += "Dossier : " + res.folder + "<br>----------------<br>";
                res.summary.forEach(i => {
                    let col = "#fb923c";
                    if (i.status.includes("OK") || i.status.includes("Mission")) col = "#4ade80";
                    if (i.status.includes("404")) col = "#f87171";
                    l.innerHTML += `<span style='color:${col}'>[${i.annee}] ${i.status}</span><br>`;
                });
                showToast("success", "Extraction terminée ! (" + res.summary.length + " fichiers)", 6000);
            }
        }).catch(err => {
            hideLoader();
            l.innerHTML += "<span style='color:red'>Erreur critique : " + err + "</span>";
        });
    }
</script>
