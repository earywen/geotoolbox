<style>
    /* Scoped Styles for Organigramme Module */
    #organigramme-wrapper {
        display: flex;
        flex-direction: column;
        height: 100%;
        width: 100%;
        color: var(--text-main);
        /* Padding to avoid overlap with floating dock */
        padding-left: 100px;
    }

    /* Toolbar */
    .org-toolbar {
        height: 70px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 30px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        background: rgba(15, 23, 42, 0.4);
    }

    .org-title {
        display: flex;
        align-items: center;
        gap: 15px;
        font-weight: 700;
        font-size: 18px;
        color: white;
    }

    .org-actions {
        display: flex;
        gap: 10px;
        align-items: center;
    }

    .divider-v {
        width: 1px;
        height: 24px;
        background: rgba(255, 255, 255, 0.1);
        margin: 0 10px;
    }

    /* Chart Container */
    #org-chart-container {
        flex: 1;
        position: relative;
        overflow: hidden;
        background-color: var(--bg-dark);
        background-image:
            linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
            linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
        background-size: 30px 30px;
        cursor: grab;
    }

    #org-chart-container:active {
        cursor: grabbing;
    }

    /* Modal */
    .modal-backdrop {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.6);
        backdrop-filter: blur(4px);
        z-index: var(--z-modal);
        display: flex;
        align-items: center;
        justify-content: center;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.3s;
    }

    .modal-backdrop.open {
        opacity: 1;
        pointer-events: auto;
    }

    .modal-content {
        width: 400px;
        background: var(--bg-panel);
        border: 1px solid var(--glass-border);
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
        border-radius: var(--radius-lg);
        padding: 24px;
        transform: translateY(20px);
        transition: transform 0.3s;
    }

    .modal-backdrop.open .modal-content {
        transform: translateY(0);
    }

    .form-group {
        margin-bottom: 16px;
    }

    .form-group label {
        display: block;
        font-size: 13px;
        font-weight: 600;
        color: var(--text-muted);
        margin-bottom: 8px;
    }

    .form-row {
        display: flex;
        justify-content: space-between;
        margin-top: 24px;
    }

    /* Node Styling (Injected into D3) */
    .org-node-card {
        background: rgba(30, 41, 59, 0.9);
        backdrop-filter: blur(8px);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 12px;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        color: white;
        transition: all 0.3s;
    }

    .org-node-card:hover {
        border-color: var(--accent);
        box-shadow: 0 0 20px rgba(56, 189, 248, 0.2);
    }
</style>

<div id="organigramme-wrapper">
    <!-- Toolbar -->
    <div class="org-toolbar">
        <div class="org-title">
            <div style="padding: 8px; background: rgba(56, 189, 248, 0.1); border-radius: 8px; color: var(--accent);">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M12 7v5" />
                    <path d="M12 12H5v5" />
                    <path d="M12 12h7v5" />
                    <rect x="9" y="3" width="6" height="4" />
                    <rect x="2" y="17" width="6" height="4" />
                    <rect x="16" y="17" width="6" height="4" />
                </svg>
            </div>
            <span>Organigramme</span>
        </div>

        <div class="org-actions">
            <button onclick="orgChart.addNode()" class="btn-glass" title="Ajouter un membre">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="10" />
                    <line x1="12" y1="8" x2="12" y2="16" />
                    <line x1="8" y1="12" x2="16" y2="12" />
                </svg>
                Ajouter
            </button>
            <button onclick="orgChart.fit()" class="btn-glass" style="width: 42px; padding: 0;" title="Recentrer">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M15 3h6v6" />
                    <path d="M9 21H3v-6" />
                    <path d="M21 3l-7 7" />
                    <path d="M3 21l7-7" />
                </svg>
            </button>

            <div class="divider-v"></div>

            <button onclick="orgChart.save()" class="btn-glass">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z" />
                    <polyline points="17 21 17 13 7 13 7 21" />
                    <polyline points="7 3 7 8 15 8" />
                </svg>
                Sauver
            </button>
            <button onclick="orgChart.load()" class="btn-glass">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
                    <polyline points="7 10 12 15 17 10" />
                    <line x1="12" y1="15" x2="12" y2="3" />
                </svg>
                Ouvrir
            </button>

            <div class="divider-v"></div>

            <button onclick="orgChart.exportPdf()" class="btn-shimmer" style="width: auto; padding: 0 20px;">
                <span class="btn-shimmer-content">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
                        <polyline points="7 10 12 15 17 10" />
                        <line x1="12" y1="15" x2="12" y2="3" />
                    </svg>
                    Export PDF
                </span>
            </button>
        </div>
    </div>

    <!-- Canvas -->
    <div id="org-chart-container"></div>

    <!-- Edit Modal -->
    <div id="node-edit-modal" class="modal-backdrop">
        <div class="modal-content">
            <div style="display:flex; justify-content:space-between; margin-bottom:20px;">
                <h3 style="margin:0; font-size:18px;">Éditer le membre</h3>
                <button onclick="orgChart.closeModal()"
                    style="background:none; border:none; color:var(--text-muted); cursor:pointer;">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="18" y1="6" x2="6" y2="18" />
                        <line x1="6" y1="6" x2="18" y2="18" />
                    </svg>
                </button>
            </div>

            <form id="node-edit-form">
                <input type="hidden" name="nodeId">
                <div class="form-group">
                    <label>Nom complet</label>
                    <input type="text" name="name" class="input-pill" required>
                </div>
                <div class="form-group">
                    <label>Responsable (N+1)</label>
                    <select name="parentId" class="input-pill">
                        <option value="">Aucun (Racine)</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Rôle / Poste</label>
                    <input type="text" name="role" class="input-pill">
                </div>
                <div class="form-group">
                    <label>Avatar (URL)</label>
                    <input type="text" name="imageUrl" class="input-pill" placeholder="https://...">
                </div>

                <div class="form-row">
                    <button type="button" onclick="orgChart.deleteCurrentNode()"
                        style="color: #ef4444; background:none; border:none; padding:10px; cursor:pointer; font-weight:600; display:flex; align-items:center; gap:5px;">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2">
                            <path d="M3 6h18" />
                            <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2" />
                        </svg>
                        Supprimer
                    </button>
                    <button type="submit" class="btn-shimmer" style="width: 120px;">
                        <span class="btn-shimmer-content">Enregistrer</span>
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

<!-- Scripts moved to index.html -->
