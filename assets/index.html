<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BURGEAPLY</title>
    <!-- LEAFLET & DEPS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet-control-geocoder/dist/Control.Geocoder.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet-control-geocoder/dist/Control.Geocoder.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="libs/lucide.js"></script>
    <!-- Leaflet Draw for polygon drawing -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet-draw@1.0.4/dist/leaflet.draw.css" />
    <script src="https://unpkg.com/leaflet-draw@1.0.4/dist/leaflet.draw.js"></script>

    <!-- Leaflet MarkerCluster -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.Default.css" />
    <script src="https://unpkg.com/leaflet.markercluster@1.4.1/dist/leaflet.markercluster.js"></script>

    <link rel="stylesheet" href="css/style.css?v=2.6">
</head>

<body>

    <!-- SPLASH SCREEN -->
    <div id="splash-screen">
        <img src="logo.png" style="width: 80px; margin-bottom: 20px; animation: float 3s infinite;">
        <div style="font-weight: 600; font-size: 24px; color:white;">BURGEAPLY</div>
        <div id="app-version" style="color:var(--text-muted); font-size:12px; margin-top:5px;">Loading...</div>
        <div class="loader-bar-bg">
            <div class="loader-bar-fill" id="splash-bar"></div>
        </div>
    </div>

    <!-- PROCESS OVERLAY -->
    <div id="processing-overlay">
        <div style="margin-bottom: 20px; animation: float 2s infinite; color: var(--accent);">
            <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 20a8 8 0 1 0 0-16 8 8 0 0 0 0 16Z" />
                <path d="M12 14a2 2 0 1 0 0-4 2 2 0 0 0 0 4Z" />
                <path d="M12 2v2" />
                <path d="M12 22v-2" />
                <path d="m17 20.66-1-1.73" />
                <path d="M11 10.27 7 3.34" />
                <path d="m20.66 17-1.73-1" />
                <path d="m3.34 7 1.73 1" />
                <path d="M14 12h8" />
                <path d="M2 12h2" />
                <path d="m20.66 7-1.73 1" />
                <path d="m3.34 17 1.73-1" />
                <path d="m17 3.34-1 1.73" />
                <path d="m11 13.73-4 6.93" />
            </svg>
        </div>
        <div id="proc-title" style="font-weight: 700; font-size: 22px;">Traitement en cours</div>
        <div id="proc-desc" style="color: var(--text-muted); margin-top: 5px;">Veuillez patienter...</div>
        <div class="loader-bar-bg" style="width: 300px; background: rgba(255,255,255,0.1);">
            <div class="loader-bar-fill" id="proc-bar"></div>
        </div>
        <div id="proc-percent"
            style="margin-top: 10px; font-family: monospace; font-weight: bold; color: var(--accent);">0%</div>
    </div>

    <!-- TOAST CONTAINER -->
    <div id="toast-container"></div>

    <div id="app" style="opacity:0; transition: opacity 1s;">

        <!-- 1. CONTENT AREA (BACKGROUND) -->
        <div id="content-area">
            <!-- HOME VIEW -->
            <div id="view-home" class="view-section active">
                <div class="home-hero">
                    <img src="logo.png" style="width: 100px; margin-bottom: 30px;">
                    <h1>BURGEAPLY</h1>
                    <p style="color: var(--text-muted); max-width: 400px; margin: 10px auto; line-height: 1.6;">
                        Plateforme d'ingénierie environnementale avancée.<br>
                        Exploration BSS, Cartographie et Outils SSP.
                    </p>
                    <div style="margin-top: 40px;">
                        <!-- Note: This button target implies the presence of the 2nd dock item (geotoolbox) -->
                        <button class="btn-shimmer" style="max-width: 250px; margin: 0 auto;"
                            onclick="switchView('cartographie', document.querySelectorAll('.dock-item')[1])">
                            <span class="btn-shimmer-content">
                                <i data-lucide="map" style="width: 18px; height: 18px;"></i> Lancer Cartographie
                            </span>
                        </button>
                    </div>
                </div>
            </div>

            <!-- PLACEHOLDER FOR DYNAMIC VIEWS -->
            <div id="content-area-placeholder"></div>
        </div>

        <!-- 2. FLOATING DOCK (FOREGROUND) -->
        <div id="dock-container" class="glass-panel">
            <div class="dock-logo">
                <img src="logo.png">
                <div class="dock-title">BURGEAPLY</div>
            </div>

            <div class="dock-item active" onclick="switchView('home', this)">
                <div class="icon-box">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" />
                        <polyline points="9 22 9 12 15 12 15 22" />
                    </svg>
                </div>
                <div class="label">Accueil</div>
            </div>

            <!-- PLACEHOLDER FOR DYNAMIC MENU ITEMS -->
            <div id="dock-menu-placeholder"></div>

            <div id="dock-footer">
                <span id="dock-footer-version">v...</span><br>
                Développé par Laurent BRIGAUD<br>
                Idée originale : Amine El Mahlali<br>
                GINGER BURGEAP
            </div>
        </div>

    </div>

    <script src="js/app.js?v=2.5"></script>
    <script src="js/cartographie.js?v=2.5"></script>
</body>

</html>
